name: CI

on:
  push:
    branches: [main]
  pull_request:

# Read-only token for every job; nothing here pushes or comments.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  landing:
    name: Landing page (Vite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run test
      # Same build Vercel runs for https://antova.vercel.app.
      - run: bun run build
      # Smoke tests on that build, desktop and mobile widths.
      - run: bunx playwright install --with-deps chromium
      - run: bun run test:e2e

  backend:
    name: Engine (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: antova_backend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: antova_backend/antova_requirements.txt
      - run: pip install -r antova_requirements.txt
      # conftest.py blanks the Anthropic credentials and uses a temp database,
      # so this never calls the paid API.
      - run: python -m pytest -q

  web:
    name: Brief site (Vite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: antova_backend/web
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: antova_backend/web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      # Includes the parity cases that pin the TypeScript leveling math to the Python engine.
      - run: npm test
